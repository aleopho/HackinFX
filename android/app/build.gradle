plugins { id 'com.android.application' }
android {
    namespace 'community.aleopho.hackinfx'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'community.aleopho.hackinfx.remote'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.2.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
dependencies { implementation 'com.journeyapps:zxing-android-embedded:4.3.0'; testImplementation 'junit:junit:4.13.2' }
