plugins { id 'com.android.application' }
android {
    namespace 'community.aleopho.hackinfx'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'community.aleopho.hackinfx.remote'; minSdk 26; targetSdk 35; versionCode 4; versionName '2.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            doFirst { layout.buildDirectory.dir('test-home').get().asFile.mkdirs() }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
        }
    }
    lint { abortOnError true }
}
dependencies { implementation 'com.journeyapps:zxing-android-embedded:4.3.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.16.1' }
