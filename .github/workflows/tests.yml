name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
        working-directory: app
      - run: python3 tools/build_effect_catalog.py
      - run: git diff --exit-code -- app/effects_catalog.json
      - run: node app/tests/verify-radius-port.mjs
      - run: python3 tools/import_asus_scope_layouts.py
      - run: git diff --exit-code -- app/asus_scope_layouts.json
      - run: python3 tools/import_openrgb_usb_catalog.py
      - run: git diff --exit-code -- app/openrgb_usb_catalog.json
      - run: node --test *.test.mjs
        working-directory: report-inbox
      - run: python3 -m unittest test_schema.py
        working-directory: report-inbox
  native-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: swiftc app/SetupSupport.swift app/tests/SetupSupportTests.swift -o /tmp/hackinfx-profile-tests
      - run: /tmp/hackinfx-profile-tests
      - run: python3 tools/prepare_openrgb_runtime.py
      - run: python3 tools/import_openrgb_smbus_safety.py
      - run: git diff --exit-code -- app/openrgb_smbus_detectors.json vendor/openrgb-runtime/smbus-detector-provenance.json
      - run: swiftc -swift-version 5 -target x86_64-apple-macos15.0 app/Localization.swift app/tests/LocalizationTests.swift -o /tmp/hackinfx-localization-tests
      - run: /tmp/hackinfx-localization-tests app/Localization
      - run: python3 tools/verify_effect_previews.py
      - run: python3 app/build_community.py
      - run: python3 tools/verify_openrgb_runtime.py
      - run: swiftc app/ReleaseVersion.swift app/tests/ReleaseVersionTests.swift -o /tmp/hackinfx-version-tests
      - run: /tmp/hackinfx-version-tests
      - run: app/HackinFX.app/Contents/Resources/HackinFXSMBus --self-test
      - run: app/HackinFX.app/Contents/Resources/HackinFXHID --self-test
      - name: Render native Control Center design check
        continue-on-error: true
        run: |
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-preview HackinFX-2.5.0-design.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-scenes HackinFX-2.5.0-scenes.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-devices HackinFX-2.5.0-devices.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-feedback HackinFX-2.5.0-feedback.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-gallery HackinFX-2.5.0-gallery.png
          HACKINFX_RENDER_LANGUAGE=de app/HackinFX.app/Contents/MacOS/HackinFX --render-center-gallery HackinFX-2.5.0-gallery-de.png
          HACKINFX_RENDER_LANGUAGE=ar app/HackinFX.app/Contents/MacOS/HackinFX --render-center-scenes HackinFX-2.5.0-canvas-ar.png
          HACKINFX_RENDER_LANGUAGE=ja app/HackinFX.app/Contents/MacOS/HackinFX --render-center-gallery HackinFX-2.5.0-gallery-ja.png
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-2.5.0-design-check-sample-data
          path: HackinFX-2.5.0-*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: codesign --verify --deep --strict app/HackinFX.app
      - run: python3 tools/check_app_bundle.py
      - run: python3 app/package_installer.py
      - run: python3 tools/verify_installer.py HackinFX-2.5.0-Installer.pkg
      - run: python3 app/package_dmg.py
      - run: hdiutil verify HackinFX-aleopho-2.5.0.dmg
      - run: python3 tools/verify_dmg.py HackinFX-aleopho-2.5.0.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-2.5.0-with-WidgetKit
          path: |
            HackinFX-aleopho-2.5.0.dmg
            HackinFX-2.5.0-Installer.pkg
          retention-days: 14
