name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
        working-directory: app
      - run: node --test *.test.mjs
        working-directory: report-inbox
      - run: python3 -m unittest test_schema.py
        working-directory: report-inbox
  native-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: swiftc app/SetupSupport.swift app/tests/SetupSupportTests.swift -o /tmp/hackinfx-profile-tests
      - run: /tmp/hackinfx-profile-tests
      - run: python3 app/build_community.py
      - name: Render native Control Center design check
        continue-on-error: true
        run: |
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-preview HackinFX-2.0-design.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-scenes HackinFX-2.0-scenes.png
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-2.0-design-check-sample-data
          path: HackinFX-2.0-*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: codesign --verify --deep --strict app/HackinFX.app
      - run: python3 tools/check_app_bundle.py
      - run: python3 app/package_dmg.py
      - run: hdiutil verify HackinFX-aleopho-2.0.0.dmg
      - run: python3 tools/verify_dmg.py HackinFX-aleopho-2.0.0.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-2.0.0-with-WidgetKit
          path: HackinFX-aleopho-2.0.0.dmg
          retention-days: 14
