name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
        working-directory: app
      - run: python3 tools/build_effect_catalog.py
      - run: git diff --exit-code -- app/effects_catalog.json
      - run: node app/tests/verify-radius-port.mjs
      - run: python3 tools/import_asus_scope_layouts.py
      - run: git diff --exit-code -- app/asus_scope_layouts.json
      - run: python3 tools/import_openrgb_usb_catalog.py
      - run: git diff --exit-code -- app/openrgb_usb_catalog.json
      - run: node --test *.test.mjs
        working-directory: report-inbox
      - run: python3 -m unittest test_schema.py
        working-directory: report-inbox
  native-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: swiftc app/SetupSupport.swift app/tests/SetupSupportTests.swift -o /tmp/hackinfx-profile-tests
      - run: /tmp/hackinfx-profile-tests
      - uses: actions/cache@v4
        with:
          path: .build-cache/openrgb
          key: openrgb-macos-${{ hashFiles('vendor/openrgb-runtime/manifest.json') }}
      - run: python3 tools/prepare_openrgb_runtime.py
      - run: python3 tools/import_openrgb_smbus_safety.py
      - run: git diff --exit-code -- app/openrgb_smbus_detectors.json vendor/openrgb-runtime/smbus-detector-provenance.json
      - run: swiftc -swift-version 5 -target x86_64-apple-macos15.0 app/Localization.swift app/tests/LocalizationTests.swift -o /tmp/hackinfx-localization-tests
      - run: /tmp/hackinfx-localization-tests app/Localization
      - run: python3 tools/verify_widget_bridge.py
      - run: python3 tools/verify_effect_previews.py
      - run: python3 tools/verify_composition.py
      - run: python3 app/build_community.py
      - run: python3 tools/verify_openrgb_runtime.py
      - run: swiftc app/ReleaseVersion.swift app/tests/ReleaseVersionTests.swift -o /tmp/hackinfx-version-tests
      - run: /tmp/hackinfx-version-tests
      - run: swiftc -swift-version 5 app/MAKRMedia.swift app/tests/MAKRMediaTests.swift -framework IOKit -framework CoreAudio -o /tmp/hackinfx-makr-media-tests
      - run: /tmp/hackinfx-makr-media-tests
      - run: app/HackinFX.app/Contents/Resources/HackinFXSMBus --self-test
      - run: app/HackinFX.app/Contents/Resources/HackinFXHID --self-test
      - name: Render native Control Center design check
        continue-on-error: true
        run: |
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-preview HackinFX-3.0.0-design.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-scenes HackinFX-3.0.0-scenes.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-devices HackinFX-3.0.0-devices.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-feedback HackinFX-3.0.0-feedback.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-gallery HackinFX-3.0.0-gallery.png
          app/HackinFX.app/Contents/MacOS/HackinFX --render-center-studio HackinFX-3.0.0-studio.png
          HACKINFX_RENDER_LANGUAGE=de app/HackinFX.app/Contents/MacOS/HackinFX --render-center-gallery HackinFX-3.0.0-gallery-de.png
          HACKINFX_RENDER_LANGUAGE=ar app/HackinFX.app/Contents/MacOS/HackinFX --render-center-scenes HackinFX-3.0.0-canvas-ar.png
          HACKINFX_RENDER_LANGUAGE=ja app/HackinFX.app/Contents/MacOS/HackinFX --render-center-gallery HackinFX-3.0.0-gallery-ja.png
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-3.0.0-design-check-sample-data
          path: HackinFX-3.0.0-*.png
          if-no-files-found: ignore
          retention-days: 14
      - run: codesign --verify --deep --strict app/HackinFX.app
      - run: python3 tools/check_app_bundle.py
      - run: python3 app/package_installer.py
      - run: python3 tools/verify_installer.py HackinFX-3.0.0-Installer.pkg
      - run: python3 app/package_dmg.py
      - run: hdiutil verify HackinFX-aleopho-3.0.0.dmg
      - run: python3 tools/verify_dmg.py HackinFX-aleopho-3.0.0.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-3.0.0-with-WidgetKit
          path: |
            HackinFX-aleopho-3.0.0.dmg
            HackinFX-3.0.0-Installer.pkg
          retention-days: 14

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifact/HackinFX-Remote-1.2.0-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android-artifact/HackinFX-Remote-1.2.0-debug.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-artifact/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: HackinFX-Remote-1.2.0-Android
          path: android-artifact/*
          retention-days: 14
