name = "hackinfx-reports"
main = "worker.mjs"
compatibility_date = "2026-10-23"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hackinfx-reports"
database_id = "REPLACE_WITH_CREATED_D1_DATABASE_ID"

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[triggers]
crons = ["0 3 * * *"]
